name: Docker Image CI ARM32

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [arm32]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build ARM32 Docker image
      run: |
       docker buildx create --use 
       docker buildx build --platform linux/arm/v7 -t betabot:latest .
       docker buildx imagetools create --tag betabot:latest --load
    
    - name: Create TAR archive
      run: docker save betabot:latest -o betabot.tar

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Archive artifacts
        uses: actions/upload-artifact@v2
        with:
          name: arm32-release
          path: betabot.tar
